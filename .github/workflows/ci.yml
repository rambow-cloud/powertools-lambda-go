name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  GOCACHE: ${{ github.workspace }}/dist/integration/go-cache

jobs:
  test:
    name: Modules and Lambda artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Check module licenses and notices
        run: uv run --no-project python tools/licenses.py --check
      - name: Test, vet, tidy-check, and verify independent consumers
        run: uv run --no-project python tools/modules.py check
      - name: Cross-compile Lambda for x86_64
        run: go build -trimpath -tags lambda.norpc -o dist/amd64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Cross-compile Lambda for arm64
        run: go build -trimpath -tags lambda.norpc -o dist/arm64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: arm64
      - name: Validate static ELF binaries and package executable bootstrap ZIPs
        run: go run ./tools/package
      - name: Upload Lambda example artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-examples-${{ github.sha }}
          path: dist/lambda-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload module verification progress
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-verification-${{ github.sha }}
          path: dist/modules/check-*/progress.json
          if-no-files-found: ignore
          retention-days: 7
