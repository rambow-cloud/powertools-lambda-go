name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  GOCACHE: ${{ github.workspace }}/dist/integration/go-cache

jobs:
  changes:
    name: Select CI suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go }}
      docs: ${{ steps.changes.outputs.docs }}
      automation: ${{ steps.changes.outputs.automation }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select suites from the complete diff
        id: changes
        run: python3 tools/ci_changes.py

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  automation:
    name: Automation
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    uses: ./.github/workflows/automation.yml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}

  test:
    name: Modules and Lambda artifacts
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Check module licenses and notices
        run: uv run --no-project python tools/licenses.py --check
      - name: Test, vet, tidy-check, and verify independent consumers
        run: uv run --no-project python tools/modules.py check
      - name: Cross-compile Lambda for x86_64
        run: go build -trimpath -tags lambda.norpc -o dist/amd64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Cross-compile Lambda for arm64
        run: go build -trimpath -tags lambda.norpc -o dist/arm64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: arm64
      - name: Validate static ELF binaries and package executable bootstrap ZIPs
        run: go run ./tools/package
      - name: Upload Lambda example artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-examples-${{ github.sha }}
          path: dist/lambda-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload module verification progress
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-verification-${{ github.sha }}
          path: dist/modules/check-*/progress.json
          if-no-files-found: ignore
          retention-days: 7

  runtime:
    name: Runtime simulation
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POWERTOOLS_ACCEPTANCE_DIR: ${{ github.workspace }}/dist/runtime-acceptance
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: 128MiB
      GOGC: '20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.21.1'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Test runtime evidence safeguards
        run: uv run --no-project python tools/test_runtime_ci.py
      - name: Install pinned TypeScript reference dependencies
        run: npm ci --prefix tools/reference
      - name: Build both architectures and run Lambda, streaming, and Valkey simulations
        run: uv run --no-project python integration/local/run.py --skip-module-checks
      - name: Verify Batch logs and spans from this run
        run: uv run --no-project python integration/local/batch_report.py
      - name: Build KMS interoperability executable
        run: go build -trimpath -o dist/local/amd64/kmsinterop ./integration/kmsinterop
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Verify Go ciphertext with the pinned TypeScript provider
        working-directory: tools/reference
        run: node generate-datamasking-kms.mjs --verify-go ../../dist/local/amd64/kmsinterop
      - name: Validate and summarize current-commit runtime evidence
        if: always()
        run: uv run --no-project python integration/local/ci_report.py
      - name: Ensure simulations preserve checked-in acceptance history
        run: git diff --exit-code
      - name: Upload runtime acceptance and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-simulation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/runtime-acceptance/*.json
            dist/runtime-acceptance/*.md
            dist/local/*.json
            dist/local/*.log
            dist/local/streaming/*.json
            dist/local/streaming/*.log
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [changes, test, runtime, docs, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          def validate(needs):
              if needs['changes']['result'] != 'success':
                  raise ValueError('Change selection did not succeed')
              selected = needs['changes']['outputs']
              for suite in ('go', 'docs', 'automation', 'release'):
                  if selected.get(suite) not in ('true', 'false'):
                      raise ValueError(f'Missing or invalid selection: {suite}')
              if selected['release'] == 'true' and selected['automation'] != 'true':
                  raise ValueError('Release checks require the automation suite')
              for job, suite in (('test', 'go'), ('runtime', 'go'), ('docs', 'docs'), ('automation', 'automation')):
                  expected = 'success' if selected[suite] == 'true' else 'skipped'
                  if needs[job]['result'] != expected:
                      raise ValueError(f'{job}: expected {expected}, got {needs[job]["result"]}')
              print('Every selected CI suite passed; unselected suites were skipped.')

          if __name__ == '__main__':
              validate(json.loads(os.environ['CI_NEEDS']))
          PY
