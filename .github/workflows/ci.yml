name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  GOCACHE: ${{ github.workspace }}/dist/integration/go-cache

jobs:
  changes:
    name: Select CI suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go }}
      docs: ${{ steps.changes.outputs.docs }}
      automation: ${{ steps.changes.outputs.automation }}
      release: ${{ steps.changes.outputs.release }}
      modules: ${{ steps.changes.outputs.modules }}
      runtime: ${{ steps.changes.outputs.runtime }}
      dynamodb: ${{ steps.changes.outputs.dynamodb }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select suites from the complete diff
        id: changes
        run: python3 tools/ci_changes.py

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  automation:
    name: Automation
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    uses: ./.github/workflows/automation.yml
    with:
      release: ${{ needs.changes.outputs.release == 'true' }}

  test:
    name: Modules and Lambda artifacts
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Check module licenses and notices
        run: uv run --no-project python tools/licenses.py --check
      - name: Test, vet, tidy-check, and verify independent consumers
        env:
          CI_MODULES: ${{ needs.changes.outputs.modules }}
          CI_FULL: ${{ needs.changes.outputs.full }}
        run: |
          uv run --no-project python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          modules = json.loads(os.environ['CI_MODULES'])
          known = {item['directory'] for item in json.loads(Path('tools/modules.json').read_text())['modules']}
          if not isinstance(modules, list) or not modules or any(not isinstance(item, str) or item not in known for item in modules):
              raise ValueError('Expected a nonempty list of known modules')
          full = os.environ['CI_FULL']
          if full not in ('true', 'false'):
              raise ValueError('Missing or invalid full-regression selection')
          command = ['uv', 'run', '--no-project', 'python', 'tools/modules.py', 'check']
          if full == 'false':
              for directory in modules:
                  command.extend(['--only', directory])
          subprocess.run(command, check=True)
          PY
      - name: Cross-compile Lambda for x86_64
        if: needs.changes.outputs.full == 'true'
        run: go build -trimpath -tags lambda.norpc -o dist/amd64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Cross-compile Lambda for arm64
        if: needs.changes.outputs.full == 'true'
        run: go build -trimpath -tags lambda.norpc -o dist/arm64/bootstrap ./examples/basic
        env:
          GOOS: linux
          GOARCH: arm64
      - name: Validate static ELF binaries and package executable bootstrap ZIPs
        if: needs.changes.outputs.full == 'true'
        run: go run ./tools/package
      - name: Upload Lambda example artifacts
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-examples-${{ github.sha }}
          path: dist/lambda-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload module verification progress
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-verification-${{ github.sha }}
          path: dist/modules/check-*/progress.json
          if-no-files-found: ignore
          retention-days: 7

  runtime:
    name: Runtime simulation
    needs: [changes, test]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POWERTOOLS_ACCEPTANCE_DIR: ${{ github.workspace }}/dist/runtime-acceptance
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: 128MiB
      GOGC: '20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Test runtime evidence safeguards
        run: uv run --no-project python tools/test_runtime_ci.py
      - name: Install pinned TypeScript reference dependencies
        run: npm ci --prefix tools/reference
      - name: Build both architectures and run Lambda, streaming, and Valkey simulations
        run: uv run --no-project python integration/local/run.py --skip-module-checks
      - name: Verify Batch logs and spans from this run
        run: uv run --no-project python integration/local/batch_report.py
      - name: Build KMS interoperability executable
        run: go build -trimpath -o dist/local/amd64/kmsinterop ./integration/kmsinterop
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Verify Go ciphertext with the pinned TypeScript provider
        working-directory: tools/reference
        run: node generate-datamasking-kms.mjs --verify-go ../../dist/local/amd64/kmsinterop
      - name: Validate and summarize current-commit runtime evidence
        if: always()
        run: uv run --no-project python integration/local/ci_report.py
      - name: Ensure simulations preserve checked-in acceptance history
        run: git diff --exit-code
      - name: Upload runtime acceptance and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-simulation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/runtime-acceptance/*.json
            dist/runtime-acceptance/*.md
            dist/local/*.json
            dist/local/*.log
            dist/local/streaming/*.json
            dist/local/streaming/*.log
          if-no-files-found: warn
          retention-days: 7

  dynamodb:
    name: DynamoDB Local
    needs: changes
    if: needs.changes.outputs.dynamodb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Test service evidence safeguards
        run: uv run --no-project python integration/local/test_dynamodb_run.py
      - name: Run real stateful adapter acceptance on the pinned local service
        run: uv run --no-project python integration/local/dynamodb_run.py
      - name: Ensure service tests preserve checked-in acceptance history
        run: git diff --exit-code
      - name: Upload service acceptance and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamodb-local-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/service-acceptance/*
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [changes, test, runtime, dynamodb, docs, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          def validate(needs):
              if needs['changes']['result'] != 'success':
                  raise ValueError('Change selection did not succeed')
              selected = needs['changes']['outputs']
              for suite in ('go', 'docs', 'automation', 'release', 'runtime', 'dynamodb', 'full'):
                  if selected.get(suite) not in ('true', 'false'):
                      raise ValueError(f'Missing or invalid selection: {suite}')
              if selected['release'] == 'true' and selected['automation'] != 'true':
                  raise ValueError('Release checks require the automation suite')
              modules = json.loads(selected.get('modules', 'null'))
              if not isinstance(modules, list) or any(not isinstance(item, str) or not item for item in modules) or len(modules) != len(set(modules)):
                  raise ValueError('Missing or invalid module selection')
              if bool(modules) != (selected['go'] == 'true'):
                  raise ValueError('Go checks require a consistent module selection')
              if any(selected[suite] == 'true' for suite in ('runtime', 'dynamodb')) and selected['go'] != 'true':
                  raise ValueError('Service/runtime checks require Go checks')
              if selected['full'] == 'true' and any(selected[suite] != 'true' for suite in ('go', 'docs', 'automation', 'release', 'runtime', 'dynamodb')):
                  raise ValueError('Full regression requires every suite')
              for job, suite in (('test', 'go'), ('runtime', 'runtime'), ('dynamodb', 'dynamodb'), ('docs', 'docs'), ('automation', 'automation')):
                  expected = 'success' if selected[suite] == 'true' else 'skipped'
                  if needs[job]['result'] != expected:
                      raise ValueError(f'{job}: expected {expected}, got {needs[job]["result"]}')
              print('Every selected CI suite passed; unselected suites were skipped.')

          if __name__ == '__main__':
              validate(json.loads(os.environ['CI_NEEDS']))
          PY

  full:
    name: Full regression
    if: always() && needs.changes.outputs.full == 'true'
    needs: [changes, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record completed full regression for release publication
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['CHANGE_RESULT'] != 'success' or os.environ['GATE_RESULT'] != 'success':
              raise ValueError('Full regression has not passed')
          print('All modules, architectures, runtime, local service, documentation and release tooling passed.')
          PY
