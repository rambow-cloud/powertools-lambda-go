name: Publish Go modules

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Merged preparation PR number
        required: true
        type: string
      publish:
        description: Create public tags and Releases (false runs preflight only)
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: [Go CI, Documentation]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: module-publication
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release:
    name: Reviewed module publication
    if: github.repository == 'rambow-cloud/powertools-lambda-go' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned GoReleaser OSS
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: Validate and optionally publish the reviewed plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pr }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: python3 tools/release_automation.py
      - name: Upload publication progress and reviewed notes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-progress-${{ github.run_id }}
          path: dist/releases/
          if-no-files-found: ignore
          retention-days: 30
