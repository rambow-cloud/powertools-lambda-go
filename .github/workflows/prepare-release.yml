name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto uses accumulated release notes)
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      version:
        description: Optional explicit target (for example v1.0.0-rc.1); leave bump at auto
        required: false
        default: ''
        type: string
      auto_publish:
        description: Publish automatically after the preparation PR merges and main checks pass
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: module-publication
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Prepare reviewed module versions
    if: github.repository == 'rambow-cloud/powertools-lambda-go' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare metadata, tracking issue, and PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_AUTOMATIC: ${{ inputs.auto_publish }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          command = ['python3', 'tools/release.py', 'prepare', '--all', '--bump', os.environ['RELEASE_BUMP']]
          if os.environ['RELEASE_VERSION']:
              command.extend(['--version', os.environ['RELEASE_VERSION']])
          if os.environ['RELEASE_AUTOMATIC'] == 'true':
              command.append('--auto-publish')
          subprocess.run(command, check=True)
          PY
      - name: Upload preparation plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-${{ github.run_id }}
          path: releases/auto-*.json
          if-no-files-found: ignore
          retention-days: 30
