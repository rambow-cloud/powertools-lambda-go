name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: website/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify locked documentation dependencies
        run: uv lock --project website --check
      - name: Test contribution workflow and issue forms
        run: uv run --project website --frozen python tools/test_contribution_workflow.py
      - name: Install pinned GoReleaser OSS for offline CLI tests
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: Test release notes and publication safeguards
        run: uv run --project website --frozen python tools/test_release.py
      - name: Test automatic release preparation and completion
        run: uv run --project website --frozen python tools/test_release_automation.py
      - name: Validate navigation coverage and targets
        run: uv run --project website --frozen python website/check_navigation.py
      - name: Validate utility guide coverage and referenced source
        run: uv run --project website --frozen python website/check_guides.py
      - name: Build and validate links and snippets
        run: uv run --project website --frozen zensical build --clean --strict --config-file mkdocs.yml
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Deploy GitHub Pages
    if: github.repository == 'rambow-cloud/powertools-lambda-go' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
