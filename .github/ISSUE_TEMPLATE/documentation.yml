name: Documentation request
description: Improve a guide, example, reference page, or documentation site.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: area
    attributes:
      label: Affected page, module, or tool
      description: Include a link or repository path if possible.
    validations:
      required: true
  - type: dropdown
    id: modules
    attributes:
      label: Affected modules
      description: Select all affected Go modules, or Repository only for repository work.
      multiple: true
      options:
        - Repository only
        - powertools-lambda-go
        - commons/awssdk
        - commons/dynamodb
        - commons/metadata
        - commons/regex
        - logger
        - metrics
        - parameters
        - signer
        - jmespath
        - datamasking/kms
        - datamasking
        - kafka/protobuf
        - kafka/avro
        - kafka
        - batch
        - idempotency
        - idempotency/cache
        - parser
        - validation
        - eventhandler/http
        - eventhandler/appsyncevents
        - eventhandler/appsyncgraphql
        - eventhandler/bedrock
        - eventhandler/http/metrics
        - eventhandler/http/tracer
        - tracer
        - tracer/xray
        - examples
        - integration
        - tools
  - type: textarea
    id: request
    attributes:
      label: Request or question
      description: Explain the problem, relevant context, and what you already tried.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      description: What change or answer would resolve this? Keep maintenance tasks scoped.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed credentials and private data from this request.
          required: true
