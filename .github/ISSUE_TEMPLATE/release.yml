name: Release tracking
description: Track one version for all maintained public components.
title: "[Release]: "
body:
  - type: markdown
    attributes:
      value: |
        Follow docs/RELEASING.md. Keep this issue open through the preparation
        PR using Refs, then close it only after publication and consumer checks.
        All maintained public modules release together at one version. Merging
        an ordinary source PR does not publish a version.
  - type: input
    id: version
    attributes:
      label: Unified release version
      description: State the shared target or auto/patch/minor/major increment. Every maintained public module is included; development and frozen modules are excluded.
      placeholder: "patch (all maintained components)"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Release scope and compatibility
      description: Describe supported behavior, limitations, breaking changes, migration guidance, and first-release scope if applicable.
    validations:
      required: true
  - type: textarea
    id: history
    attributes:
      label: Previous versions and accumulated changes
      description: Link the previous project version and relevant PRs. The root Release groups actual changes by component and shows the full version table.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Publication acceptance
      description: Required checks, release-note review, dependency order, real public consumer verification, and any release-specific gates.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before publication
      options:
        - label: I understand that merging a preparation PR with automatic publication enabled authorizes the full unified release after checks pass; manual publication remains available.
          required: true
        - label: I removed credentials and private data from release scope and evidence.
          required: true
