name: Bug report
description: Report a reproducible problem in a utility or supported workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Use synthetic input and remove secrets,
        account identifiers, and production data. Do not disclose vulnerabilities
        here; see the contribution guide for a private reporting route.
  - type: input
    id: module
    attributes:
      label: Affected module or tool
      placeholder: logger, eventhandler/http, documentation build, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the exact Go module version or repository commit you tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, OS/architecture, local or Lambda runtime, and relevant sanitized configuration.
      placeholder: Go 1.26; Linux amd64; CGO_ENABLED=0; local execution
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a small code example, synthetic input, and steps or commands to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen? Include a reference if reporting a compatibility difference.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error output and explain the impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria or proposed fix
      description: Optional. Describe a regression test or observable outcome that would resolve this.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and checked the documented compatibility boundaries.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
